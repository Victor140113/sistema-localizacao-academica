
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>
    <title>Login - SLA</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>
    <div class="login-container">

        <div class="header">
            <h1>SLA</h1>
            <p>Sistema de Localização Acadêmica</p>
        </div>

        <h:form>

            <h:messages
                    globalOnly="true"
                    style="color: #dc2626; margin-bottom: 15px;"/>

            <div class="field">
                <h:outputLabel for="email" value="E-mail"/>

                <h:inputText id="email"
                             value="#{loginController.email}"
                             required="true"
                             requiredMessage="Informe seu e-mail."
                             placeholder="seu.email@instituicao.edu.br"/>
            </div>

            <div class="field">
                <h:outputLabel for="senha" value="Senha"/>

                <h:inputSecret id="senha"
                               value="#{loginController.senha}"
                               required="true"
                               requiredMessage="Informe sua senha."
                               placeholder="Digite sua senha"/>
            </div>

            <h:commandButton value="Entrar"
                             action="#{loginController.entrar}"
                             styleClass="login-button"/>

        </h:form>

        <div class="footer">
            Sistema de Localização Acadêmica
        </div>

    </div>
</h:body>
</html>
